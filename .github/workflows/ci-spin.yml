# Runs Fermyon's own packager over the Spin adapter and gates the
# component's size.
#
# `cargo check --target wasm32-wasip2` (in test.yml) proves the crate
# compiles. It does NOT prove `spin build` accepts the manifest, nor
# that the component the manifest points at fits the platform budget.
# This workflow checks declarations through the vendor loader, runs the
# vendor packager, and measures the real artifact. The loader test uses a
# deliberately absent component to stop before guest execution.
#
# Spin's manifest selects wasm-release, inheriting release optimizations
# without debuginfo. Native release builds retain workspace line info.
# Measure the component produced by spin build against the unchanged
# budget below; historical size measurements cannot establish its size.
#
# WHAT THIS GATE DOES NOT COVER: no local runtime runs here, so nothing
# in this workflow probes per-call cancellation, the per-call deadline
# or the response body cap. Those are proven over a real socket on the
# axum target, in `crates/auctioneer-adapter-axum/tests`. `src/envelope.rs`
# records why a local run cannot do it here: `spin up` fails on
# `config store id 'auctioneer_runtime' failed to open`, so boot never
# completes.
name: "CI: Spin"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Decimal bytes, not binary MiB. Fermyon Cloud documents a 100 MB
  # application-package quota and the uncompressed component wasm
  # dominates that package; 50 MB is a project budget leaving 2x
  # headroom, the same way the Cloudflare gate's 9,000,000 sits under
  # a 10 MB ceiling.
  SPIN_COMPONENT_MAX_BYTES: 50000000

jobs:
  spin-build:
    name: spin build + component size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-spin-vendor-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-spin-vendor-

      - name: Retrieve Rust version
        id: rust-version
        run: echo "rust-version=$(grep '^rust ' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Rust tool chain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.rust-version.outputs.rust-version }}

      # `spin build` shells out to the manifest's build command, which
      # targets wasm32-wasip2. The target has to be present before spin
      # runs or the inner cargo invocation fails.
      - name: Add the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Install spin
        run: bash .github/workflows/scripts/ci-spin/install-spin.sh

      - name: Validate optional secret declarations with Spin
        run: cargo test --locked -p auctioneer-adapter-spin --test manifest_usersync_cookie_keys -- --ignored

      # The vendor packager. Not `cargo build`: spin parses spin.toml,
      # resolves the component's build command and validates the
      # component it produces.
      - name: spin build
        working-directory: crates/auctioneer-adapter-spin
        run: spin build

      # Exact measurement of the component the manifest points at, per
      # the M3b spec. wasm32-wasip2, not wasip1.
      - name: Measure the built component
        id: size
        run: bash .github/workflows/scripts/ci-spin/measure-component.sh

      - name: Upload the built component
        uses: actions/upload-artifact@v4
        with:
          name: spin-component
          path: target/wasm32-wasip2/wasm-release/auctioneer_adapter_spin.wasm
          if-no-files-found: error
