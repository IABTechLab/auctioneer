# Runtime policy authored and pushed directly by EdgeZero's typed config commands.
# This file is not compiled into the application. Product defaults are neutral;
# omitted fields inherit those defaults, then account_defaults, then the selected
# accounts entry. Each push replaces the complete policy, not the previous blob.
#
# auctioneer-cli config validate --adapter axum
# auctioneer-cli config diff --adapter axum
# auctioneer-cli config push --adapter axum
#
# The SDK applies environment overrides at authoring time only, and only to keys
# already present in this file. For example:
# Example: AUCTIONEER__HOST__RESOURCE_LIMITS__DEFAULT_TMAX_MS=1500
# An omitted/commented key cannot be created through the environment. --no-env
# disables the overlay. Running instances read the stored envelope, not this file
# or these environment variables. CLI authoring hardening remains tracked in #142.
# Envelope integrity detects drift; config-store write access is the trust boundary.

schema_version = 1

[host]
status_response = "auctioneer local"

# Requested resource limits can lower, but never expand, installed capacity.
[host.resource_limits]
default_tmax_ms = 1000
max_tmax_ms = 2000
max_bidder_response_bytes = 262144
max_bidders_per_auction = 50
max_outbound_requests = 100
max_outbound_raw_bytes = 262144
max_outbound_request_bytes = 262144
max_transport_bytes = 262144
max_decoded_bytes = 262144
max_parsed_nodes = 65536

[host.gdpr]
enabled = true
default_value = "0"
host_vendor_id = 0
non_standard_publishers = []

[host.gdpr.tcf2]
enabled = true

[host.gdpr.tcf2.purpose_one_treatment]
enabled = true
access_allowed = true

[host.gdpr.tcf2.purposes.2]
enforce_algo = "full"
enforce_purpose = "enabled"
enforce_vendors = "enabled"
vendor_exceptions = []

[host.gdpr.tcf2.special_features.1]
enforce = "enabled"
vendor_exceptions = []

# Independent of the GDPR master switch and publisher exceptions.
[host.ccpa]
enforce = true

[host.lmt]
enforce = true

[host.host_cookie]
# Source identity cookie, distinct from Auctioneer's fixed writable uids cookie.
cookie_name = "auctioneer_uid"
family = "auctioneer"
ttl_days = 90
# Zero disables logical eviction, not the Set-Cookie field-size cap.
max_cookie_size_bytes = 0
# domain = "sync.publisher.example"
# [host.host_cookie.optout_cookie]
# name = "auctioneer_optout"
# value = "1"

# This explicit demonstration service exists only in this runtime policy.
# Replace its origin before deployment; omission leaves sync unconfigured.
[host.user_sync]
external_url = "https://sync.example.test"
priority_groups = []
allowed_origins = []
# redirect_url = "{{.ExternalURL}}/setuid?bidder={{.SyncerKey}}&uid={{.UserMacro}}"

[host.user_sync.cooperative]
enabled_by_default = false

# Use an enabled public bidder definition when adding aliases or bidder settings.
[host.aliases]
# fake_alias = "fake_bidder"

[account_defaults]
disabled = false
debug_allow = false
bid_rounding = "down"
targeting_prefix = "hb"
# truncate_target_attribute = 20

[account_defaults.gdpr]
enabled = "unset"
purposes = {}
special_features = {}
basic_enforcement_vendors = []

[account_defaults.gdpr.channel_enabled]
web = "unset"
app = "unset"
amp = "unset"
video = "unset"
dooh = "unset"

[account_defaults.ccpa]
enabled = "unset"

[account_defaults.privacy.ipv4]
anon_keep_bits = 24

[account_defaults.privacy.ipv6]
anon_keep_bits = 56

[account_defaults.cookie_sync]
default_limit = 5
max_limit = 10
default_coop_sync = false

# Fictional publisher policy demonstrates the last account layer, not a compiled
# customer identity. Unknown/missing publisher ids use account_defaults.
[accounts.fake_publisher]
debug_allow = true
targeting_prefix = "ad"

[accounts.fake_publisher.cookie_sync]
priority_groups = []

# Account GDPR tri-states fall through to the host when unset.
# [accounts.fake_publisher.gdpr]
# enabled = "unset"
# basic_enforcement_vendors = []

# [accounts.fake_publisher.gdpr.channel_enabled]
# web = "unset"
# app = "unset"
# video = "unset"
# amp = "unset"
# dooh = "unset"

# Keyed enforcement overrides leave unnamed purposes/features unchanged.
# [accounts.fake_publisher.gdpr.purposes.3]
# enforce_purpose = "disabled"

# [accounts.fake_publisher.gdpr.special_features.1]
# enforce = "disabled"

# CCPA resolves the trusted inventory channel, then account, then host.
# [accounts.fake_publisher.ccpa]
# enabled = "unset"
# [accounts.fake_publisher.ccpa.channel_enabled]
# web = "enabled"
# app = "unset"
# dooh = "unset"

# Activities use the first matching rule, then the default (true if absent).
# Conditions AND the name/type clauses and OR entries within each clause.
# Names use Unicode simple folding against the requested bidder/alias only.
# An override replaces the whole rules array; an empty array clears it.
# Per activity: at most 128 rules, 128 combined condition entries per rule,
# and 128 UTF-8 bytes per component name. Unknown fields/names are errors.
# [accounts.fake_publisher.privacy.allowactivities.fetchBids]
# default = true
# rules = []
# [accounts.fake_publisher.privacy.allowactivities.transmitUfpd]
# default = true
# [[accounts.fake_publisher.privacy.allowactivities.transmitUfpd.rules]]
# allow = false
# condition = { componentName = ["fake_alias"], componentType = ["bidder"] }
# [accounts.fake_publisher.privacy.allowactivities.transmitPreciseGeo]
# default = false
# [accounts.fake_publisher.privacy.allowactivities.transmitTid]
# default = false
# syncUser is consumed by user-sync permission checks; other accepted activities
# include reportAnalytics, enrichUfpd and transmitUniqueRequestIds. Config alone
# does not activate their consumers. COPPA has no disable switch.

# IP anonymization is account-scoped, with independent defaults for each family.
# [accounts.fake_publisher.privacy.ipv4]
# anon_keep_bits = 24
# [accounts.fake_publisher.privacy.ipv6]
# anon_keep_bits = 56

# Nullable leaves use TOML inline { clear = true } to reset inherited values.
# In the existing account table: truncate_target_attribute = { clear = true }
# In the existing cookie_sync table: max_limit = { clear = true }

[features]
gzip_outbound = true
returnallbidstatus_default = false

[bidders]
# [bidders.fake_bidder]
# enabled = true
# usersync_enabled = false
# timeout_ms = 300
# sample_rate = 1.0
# Bidder-owned settings retain their implementation-tagged schema.

# Optional floor-only currency conversion; response currency stays USD.
# [floor_currency]
# expires_at = 2000000000
# [floor_currency.usd_per_unit]
# QAA = 2.5
