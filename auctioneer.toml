# Complete reference for the supported runtime operator policy. Values below are
# examples, not production recommendations. Replace fictional domains and names.
# No bidder is enabled by this file; bidder-specific examples stay commented.
#
# This file is authored and pushed directly by EdgeZero's typed config commands;
# it is not compiled into the application. Product defaults are neutral. Omitted
# fields inherit within this document: product defaults, then account_defaults,
# then the selected accounts entry. Each push replaces the complete policy, not
# just fields from the previous blob. Unknown fields are rejected. Nullable fields
# use explicit { clear = true } resets, not JSON null. Some optional bidder/activity
# leaves interpret null as omission; prefer the explicit TOML forms shown here.
#
# auctioneer-cli config validate --app-config auctioneer.toml
# auctioneer-cli config diff --adapter axum --app-config auctioneer.toml
# auctioneer-cli config push --adapter axum --app-config auctioneer.toml
#
# The SDK applies environment overrides at authoring time only, and only to keys
# already present in this file. For example:
# `AUCTIONEER__HOST__RESOURCE_LIMITS__DEFAULT_TMAX_MS=1500`
# An omitted/commented key cannot be created through the environment. --no-env
# disables the overlay. Running instances read the stored envelope, not this file
# or these environment variables. CLI authoring hardening remains tracked in #142.
# Envelope integrity detects drift; config-store write access is the trust boundary.
#
# Adapter bindings, installed capacity, compiled capabilities and raw secret values
# are not operator-policy fields. Configure deployment bindings through EdgeZero
# and put credentials in its secret store, never in this document.

schema_version = 1

[host]
# Plain-text response used by the status handler.
status_response = "auctioneer local"

# Omit this section or authenticate_health to keep GVL health closed. The secret
# reference names an entry in the declared default Secret Store, never token bytes.
# Nonempty names are 1..128 UTF-8 bytes, without ASCII controls or surrounding
# whitespace. authenticate_health = true requires a nonempty reference.
# authenticate_health = false permits an absent, empty or valid named reference
# and never reads the secret; restrict /_auctioneer/* at ingress in that mode.
# A reference without authenticate_health, unknown fields and explicit nulls fail.
[host.gvl]
authenticate_health = true
authenticate_health_token_secret = "health_gvl_token"

# Requested limits can lower, but never expand, independently installed capacity.
# Durations are milliseconds, sizes are bytes, and counts are integers.
[host.resource_limits]
# Timeout requests: 1..30000 ms; actual dispatch still obeys the auction deadline.
default_tmax_ms = 1000
max_tmax_ms = 2000
# Legacy bidder-response cap: 1024..16777216 bytes.
max_bidder_response_bytes = 262144
# Syntactic ranges: 1..500 bidders and 1..1000 outbound calls per auction.
max_bidders_per_auction = 50
max_outbound_requests = 100
# Request-body caps: 1024..16777216 bytes, before and after encoding.
max_outbound_raw_bytes = 262144
max_outbound_request_bytes = 262144
# Response caps: 1024..104857600 bytes, on the wire and after decoding.
max_transport_bytes = 262144
max_decoded_bytes = 262144
# JSON structural cap: 1..1048576 nodes. Applies to inbound auction parsing before
# account selection and to bidder response parsing; it is not response-only.
max_parsed_nodes = 65536

[host.gdpr]
enabled = true
# "0" or "1": fallback when request/geo signals do not settle applicability.
default_value = "0"
# 0 means no declared host GVL vendor id; set the actual id when applicable.
host_vendor_id = 0
# Publisher ids exempted from the ordinary GDPR path; empty means no exceptions.
non_standard_publishers = []

[host.gdpr.tcf2]
enabled = true

[host.gdpr.tcf2.purpose_one_treatment]
enabled = true
access_allowed = true

# Purpose ids are 1..10. Repeat this shape with the required id, not a new field.
# enforce_algo: "full" or "basic". Enforcement tri-states: "unset", "enabled",
# "disabled". Vendor exception entries are bidder identities, not GVL numbers.
[host.gdpr.tcf2.purposes.2]
enforce_algo = "full"
enforce_purpose = "enabled"
enforce_vendors = "enabled"
vendor_exceptions = []

# Special-feature ids are 1..12; the same tri-state and name-list rules apply.
[host.gdpr.tcf2.special_features.1]
enforce = "enabled"
vendor_exceptions = []

# CCPA and LMT enforcement are independent of the GDPR master switch.
[host.ccpa]
enforce = true

[host.lmt]
enforce = true

[host.host_cookie]
# Source identity cookie, distinct from Auctioneer's fixed writable uids cookie.
cookie_name = "auctioneer_uid"
family = "auctioneer"
# Omit to inherit; { clear = true } removes Domain (a host-only cookie).
domain = "sync.example.test"
ttl_days = 90
# Zero disables logical eviction, not the complete Set-Cookie field-size cap.
max_cookie_size_bytes = 0

[host.host_cookie.optout_cookie]
# The whole opt-out cookie may be cleared; its individual leaves inherit if absent.
name = "auctioneer_optout"
value = "1"

# This explicit demonstration service exists only in this runtime policy.
# Replace its origin before deployment; omission leaves sync unconfigured unless
# an explicit parent supplies it. { clear = true } disables an inherited service.
[host.user_sync]
external_url = "https://sync.example.test"
# Template macros are literal here, not environment-variable expansion. Keep uid
# last and a single bidder binding. The standard template below carries every
# privacy signal. BidderName is also supported in place of SyncerKey.
redirect_url = "{{.ExternalURL}}/setuid?bidder={{.SyncerKey}}&gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&f={{.SyncType}}&uid={{.UserMacro}}"
# Groups are arrays of bidder-name arrays; [] clears the inherited ordering.
# Example ordering: [["fake_first", "fake_second"], ["fake_third"]].
priority_groups = []
# Exact browser origins; for example ["https://publisher.example"].
allowed_origins = []

[host.user_sync.cooperative]
enabled_by_default = false

# Alias names resolve to compiled public bidder definitions, not new implementations.
# Replace both placeholders with identities appropriate for the deployed catalog.
[host.aliases]
# fake_alias = "fake_bidder"

# The complete account shape below is shared by account_defaults and accounts.<id>.
# Named accounts may override any subset; omitted leaves retain the earlier layer.
[account_defaults]
max_transport_bytes = 262144
max_decoded_bytes = 262144
disabled = false
# Debug must also be requested by the auction; this is permission, not activation.
debug_allow = false
# Primary modes: "down", "up", "nearest", "timesplit".
bid_rounding = "down"
# Prefix length: 1..8 characters. Targeting attribute truncation: 12..20.
targeting_prefix = "hb"
truncate_target_attribute = 20

[account_defaults.gdpr]
# Channel -> account -> host TCF2 fallback. "unset" defers to the next level.
enabled = "unset"
# Bidder names that opt into basic enforcement; [] means no exceptions.
basic_enforcement_vendors = []

[account_defaults.gdpr.purpose_one_treatment]
# Boolean values, unlike the tri-states above. Clear either to fall back to host.
enabled = true
access_allowed = true

[account_defaults.gdpr.channel_enabled]
web = "unset"
app = "unset"
amp = "unset"
video = "unset"
dooh = "unset"

# Keyed account overrides leave unnamed purpose/feature entries unchanged.
[account_defaults.gdpr.purposes.2]
enforce_algo = "full"
enforce_purpose = "unset"
enforce_vendors = "unset"
vendor_exceptions = []

[account_defaults.gdpr.special_features.1]
enforce = "unset"
vendor_exceptions = []

# CCPA resolves the trusted inventory channel, then account, then host.
[account_defaults.ccpa]
enabled = "unset"

[account_defaults.ccpa.channel_enabled]
web = "unset"
app = "unset"
amp = "unset"
video = "unset"
dooh = "unset"

# Address bits retained during anonymization: IPv4 0..32, IPv6 0..128.
[account_defaults.privacy.ipv4]
anon_keep_bits = 24

[account_defaults.privacy.ipv6]
anon_keep_bits = 56

# Activities use the first matching rule, then default (true when absent).
# Conditions AND name/type clauses and OR entries within a clause. Names use
# Unicode simple folding against the requested bidder/alias, not wildcard syntax.
# componentType values: "bidder", "analytics", "rtd", "general".
# An override replaces the whole rules array; [] clears it. Per activity: at most
# 128 rules, 128 combined condition entries per rule, 128 UTF-8 bytes per name.
# A conditional-denial example follows the named publisher below.
[account_defaults.privacy.allowactivities.fetchBids]
default = true
rules = []

[account_defaults.privacy.allowactivities.transmitUfpd]
default = true
rules = []

[account_defaults.privacy.allowactivities.transmitPreciseGeo]
default = true
rules = []

[account_defaults.privacy.allowactivities.transmitTid]
default = true
rules = []

[account_defaults.privacy.allowactivities.syncUser]
default = true
rules = []

# These names are accepted policy, but config alone does not activate consumers.
[account_defaults.privacy.allowactivities.reportAnalytics]
default = true
rules = []

[account_defaults.privacy.allowactivities.enrichUfpd]
default = true
rules = []

[account_defaults.privacy.allowactivities.transmitUniqueRequestIds]
default = true
rules = []

# COPPA has no disable switch; activity grants do not override privacy denials.
[account_defaults.cookie_sync]
default_limit = 5
max_limit = 10
default_coop_sync = false
priority_groups = []

# Fictional publisher demonstrates the final account layer, not a compiled tenant.
# Unknown/missing publisher ids use account_defaults. All account fields shown
# above are also valid beneath this table; there is no separate named-account API.
[accounts.fake_publisher]
debug_allow = true
targeting_prefix = "ad"

[accounts.fake_publisher.cookie_sync]
priority_groups = []

# Named-account examples use the same shape as account_defaults above.
# Uncomment these tables to override only the illustrated leaves.
# [accounts.fake_publisher.gdpr.channel_enabled]
# web = "unset"
#
# [accounts.fake_publisher.privacy.ipv4]
# anon_keep_bits = 24
#
# [accounts.fake_publisher.ccpa.channel_enabled]
# web = "unset"

# Append this block to apply a conditional rule to the fictional publisher.
# A missing/empty condition matches every component. Rules still need allow.
# BEGIN ACTIVITY RULE EXAMPLE
# [accounts.fake_publisher.privacy.allowactivities.transmitUfpd]
# default = true
# [[accounts.fake_publisher.privacy.allowactivities.transmitUfpd.rules]]
# allow = false
# condition = { componentName = ["fake_alias"], componentType = ["bidder"] }
# END ACTIVITY RULE EXAMPLE

[features]
# Only affects bidders declaring outbound gzip support; false sends plaintext.
gzip_outbound = true
# Default when the auction does not request its own returnallbidstatus value.
returnallbidstatus_default = false

[bidders]
# Each public bidder or alias has the common knobs shown below. A cap resolves
# per field through the observable name, base, selected account and host, and
# remains bounded by installed capacity. timeout_ms is 1..30000; sample_rate is
# finite 0.0..1.0. enabled=false disables with a warning; sample_rate=0 silently
# excludes traffic. Settings do not register or activate a new implementation.
#
# This block is a FIELD REFERENCE, not a deployable combined settings object.
# Replace fake_bidder with a compiled public name, set implementation to its
# owner, and keep ONLY fields declared by that owner's bidder.toml
# [settings.fields]. The settings table lists every currently supported
# bidder-owned field across all implementations. Do not paste that union into a
# single bidder's settings.
# implementation: required owner key on the bidder row whenever settings are
# supplied. It must match the resolved bidder owner. The settings subconfig holds
# only that owner's fields. Omit both implementation and settings to use defaults.
# hb_source/hb_source_video: integer protocol source values.
# supply_id: nonempty routing identifier when required by the implementation.
# credentials_secret: a secret-store key, never the credential bundle itself.
# external_url: publisher-facing URL used by the owning protocol.
# region: "us-east", "us-west", "eu" or "apac" for the regional implementation.
# endpoint: required operator destination for enabled Mocktioneer; HTTPS works in normal builds.
# BEGIN BIDDER EXAMPLE
# [bidders.fake_bidder]
# enabled = true
# implementation = "fake_implementation"
# usersync_enabled = false
# timeout_ms = 300
# sample_rate = 1.0
# max_transport_bytes = 131072
# max_decoded_bytes = 262144
#
# [bidders.fake_bidder.settings]
# hb_source = 5
# hb_source_video = 6
# supply_id = "fake_supply"
# credentials_secret = "fake_credential_bundle"
# external_url = "https://publisher.example"
# region = "us-east"
# endpoint = "https://mock-bidder.example.test/openrtb2/auction"
# END BIDDER EXAMPLE

# Optional floor-only currency conversion. Append this block to opt in; response
# currency stays USD. expires_at is an exclusive Unix-second expiry, not a TTL.
# Up to 256 three-uppercase-letter rates: finite positive USD per foreign unit.
# USD is implicit identity and cannot be overridden. QAA is an illustrative code;
# replace the code, rate and expiry with a fresh operator-owned snapshot.
# BEGIN FLOOR CURRENCY EXAMPLE
# [floor_currency]
# expires_at = 2000000000
# [floor_currency.usd_per_unit]
# QAA = 2.5
# END FLOOR CURRENCY EXAMPLE

# Explicit clears are supported ONLY on the nullable fields listed below.
# Replace corresponding values/tables; do not append duplicate TOML keys.
# This is a standalone policy illustrating all compatible clears, not an overlay
# that preserves the rest of the active reference when pushed. Clear is not false,
# zero, [], "unset" or omission. Non-nullable leaves cannot use { clear = true }.
# BEGIN CLEAR EXAMPLES
# schema_version = 1
# [host]
# user_sync = { clear = true }
# [host.host_cookie]
# domain = { clear = true }
# optout_cookie = { clear = true }
# [account_defaults]
# truncate_target_attribute = { clear = true }
# [account_defaults.cookie_sync]
# default_limit = { clear = true }
# max_limit = { clear = true }
# default_coop_sync = { clear = true }
# priority_groups = { clear = true }
# [account_defaults.gdpr.purpose_one_treatment]
# enabled = { clear = true }
# access_allowed = { clear = true }
# END CLEAR EXAMPLES

# Redirect clear is separate because it needs a configured service. It removes an
# inherited redirect override and uses the service's standard redirect template;
# it does not disable the service itself. Again, this is a standalone policy.
# BEGIN SYNC REDIRECT CLEAR EXAMPLE
# schema_version = 1
# [host.user_sync]
# external_url = "https://sync.example.test"
# redirect_url = { clear = true }
# END SYNC REDIRECT CLEAR EXAMPLE
