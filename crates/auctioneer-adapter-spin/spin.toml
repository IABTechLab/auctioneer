spin_manifest_version = 2

[application]
name = "auctioneer-adapter-spin"
version = "0.1.0"

# SDK secret reads need both the application declaration and component mapping.
# Select health_gvl_token via gvl.authenticated_health.token_secret in the pushed
# operator policy. Different entry names need their own secret declaration and
# component mapping; the SDK lowercases names before variables::get.
# Empty secret defaults are unusable and keep health closed. Provision real
# credentials through a variable provider.
[variables]
health_gvl_token = { required = false, default = "", secret = true }
# One atomic JSON keyring, resolved only when user-sync needs UID state.
# Provision through a variable provider; never bake a usable signing key.
usersync_cookie_keyring = { required = false, default = "", secret = true }
# Runtime-environment keys retain their underscores and are lowercase in Spin.
edgezero_logging_level = { default = "INFO" }

[[trigger.http]]
route = "/..."
component = "auctioneer-adapter-spin"

[component.auctioneer-adapter-spin]
source = "../../target/wasm32-wasip2/wasm-release/auctioneer_adapter_spin.wasm"
allowed_outbound_hosts = ["https://*:*"]
# Mapped into the component, which is what makes `variables::get`
# resolve them. Declaring without mapping leaves the reads failing
# exactly as if nothing were declared.
[component.auctioneer-adapter-spin.variables]
health_gvl_token = "{{ health_gvl_token }}"
usersync_cookie_keyring = "{{ usersync_cookie_keyring }}"
edgezero_logging_level = "{{ edgezero_logging_level }}"
[component.auctioneer-adapter-spin.build]
command = "cargo build --target wasm32-wasip2 --profile wasm-release"
watch = ["src/**/*.rs", "Cargo.toml"]
