[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/criteo"
tree = "c20fec73c98f94ce49874ae106f5171ec40fd6ed"
port_differences = [
    """\
    Bounded Rust protocol candidate with an opt-in native-only public definition under AG's \
    approved 2026-10-30 design. Publication does not establish resource qualification, \
    selected-flow acceptance or live authorization.""",
    """\
    Request contract: one borrowed OpenRTB POST through the existing bounded sink \
    and endpoint builder, all scoped impression IDs in order, no provider-added headers, no \
    caller clone or uncapped intermediate body. Host and Content-Length remain \
    transport-owned.""",
    """\
    Response contract: 204 is empty, HTTP 400 is code 2, other non-200 is code 4. \
    Source numeric status messages are fixed/redacted. Sealed malformed input remains code \
    14/ResponseParse and node refusal code 4/ResponseParse. Wire currency is preserved \
    including absent/empty, without replacing it with USD.""",
    """\
    Criteo ext.prebid.type selects offered media and ordinary bids must correlate with both \
    request and exact sent-call IDs. Bid-local unsupported media, bad networkName or \
    ambiguous known keys preserve valid siblings and independently parsed browser configs. \
    All-invalid bids with valid configs remain an Ok result carrying errors.""",
    """\
    Response networkName enriches existing bid.ext.prebid.meta.networkName while preserving \
    other metadata. No second TypedBid metadata channel is introduced. Optional \
    missing/empty networkName does not fabricate metadata.""",
    """\
    Only the first igs entry in each igi group supplies config; an absent first config does \
    not search later entries. Any present JSON config including null is preserved. Owned \
    parsed.ext values are moved, never cloned, serialized or reparsed from raw bytes.""",
    """\
    Malformed optional IGI shapes or ambiguous recognized optional keys suppress all \
    optional configs, never ordinary bids. Null group/igs pointers are handled safely \
    instead of reproducing source panic behavior. Node-budget refusal remains fatal before \
    optional interpretation.""",
    """\
    Single ASCII-case-insensitive known-key spellings are accepted; competing spellings are \
    rejected at optional-root or bid-local scope. Generic envelope case matching, duplicate \
    identical JSON keys and Go numeric/parser quirks are not bidder-local compatibility \
    goals.""",
    """\
    The existing typed sealed decoder rejects malformed canonical bid.ext/prebid/type before \
    bidder dispatch. It also erases canonical null presence for some Option fields, \
    preventing reliable null-plus-case-variant ambiguity detection. These inherited decoder \
    boundaries need shared ownership; raw-body access or a second parse is not an acceptable \
    workaround.""",
    """\
    BrowserAuctionConfig contains only imp_id and config. The exchange authorizes records \
    against request and nonempty sent IDs and supplies requested bidder plus canonical \
    adapter identities. Opaque provider payload names never authorize wrapper identities.""",
    """\
    Thirteen verbatim protocol captures total 42563 bytes: ten successful source examples \
    and HTTP 204/400/500. Seven successful originals omit response.id: conformance asserts \
    the original sealed refusal, then explicitly replays an envelope-only required-ID \
    correction to cover media and IGI without changing retained bytes or claiming \
    original-envelope parity.""",
    """\
    Parameter cases are the literal 16 validParams and 19 invalidParams JSON strings \
    extracted from pinned params_test.go, not results generated by running Go. No Go, YAML \
    or license files are retained. The adjacent factory fixture is independently authored \
    local evidence, not an immutable source artifact.""",
]

