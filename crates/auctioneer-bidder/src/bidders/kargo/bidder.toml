key = "kargo"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.kargo]
defaultEnabled = false
endpoint = "https://krk2.kargo.com/api/v1/openrtb"
endpointCompression = "gzip"
gvlVendorID = 972

[definitions.kargo.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.kargo.maintainer]
email = "kraken@kargo.com"

[definitions.kargo.openrtb]
gpp-supported = true
version = 2.6

[definitions.kargo.userSync.redirect]
url = "https://crb.kargo.com/api/v1/dsync/PrebidServer?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&r={{.RedirectURL}}"
userMacro = "$UID"

[provenance]
origin = "reference"

[provenance.sources.upstream]
repository = "https://github.com/prebid/prebid-server.git"
revision = "d7f8515b86258688304b0d9b6668c6a0e258bc9e"

[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/kargo"
tree = "fc7c95f73285600c948892806b9873092f4544d1"
port_differences = [
    """\
    Bounded source-port candidate with a stateless KargoBidder factory and opt-in native-only \
    publication under AG's approved 2026-10-30 design. Publication does not establish serving \
    acceptance, protocol parity, migration, live authorization or resource qualification.""",
    """\
    Source marshals the whole request into an allocated POST body; Rust sends one borrowed, \
    capped, unchanged POST without request materialization or fanout.""",
    """\
    Source uses legacy bid.ext.mediaType for video/native with a banner fallback. Rust passes \
    that hint or fallback through shared request-correlated classification, rejecting \
    conflicting hints, unoffered media types and unknown impression IDs while partitioning \
    candidate-local failures.""",
    """\
    The source JSON decoder lowercases mediaType keys. Rust preserves single-key ASCII variants \
    and dotted-capital-I recognition without allocation; multiple matching spellings are a \
    bid-local ambiguity error, not a guess at lost source wire order. AG approved the \
    single-key/ambiguity boundary on 2026-10-23. Exact duplicate JSON names follow the existing \
    shared parser's last-value rule.""",
    """\
    Source returns no bids for HTTP 204 and BadServerResponse (code 4), not BadInput, for all \
    other non-200 statuses including HTTP 400. Rust preserves the source's numeric status \
    message; shared parse failures use fixed diagnostics without raw parser errors or body \
    values.""",
    """\
    Source overwrites the shared helper's USD default with response.cur, including an absent \
    currency's empty value; shared Rust response classification defaults absent or empty \
    currency to USD.""",
    """\
    Presence-aware typed OpenRTB ingress preserves explicit video.mimes=null, and both original \
    video/no-content captures now compare without deleting that field. Shared extension-root \
    typing still rejects non-object bid extensions as response-wide parse errors instead of \
    applying a legacy hint fallback. Complete wire parity remains unclaimed.""",
    """\
    All five raw JSON fixtures are retained byte-identically as independent source \
    expectations. Conformance names inherited representation differences and shared policies; \
    it does not claim complete parity. The source JSON runner compares request bodies \
    structurally; source tests were not executed.""",
]

