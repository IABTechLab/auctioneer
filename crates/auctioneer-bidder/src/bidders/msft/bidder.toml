category = "implementation"
source = "upstream"
source_path = "adapters/msft"
tree = "3bf17770b0be04d6238475555344a6a65ae3cf82"
port_differences = [
    """\
    Stateless protocol candidate with opt-in native-only publication under AG's approved \
    2026-10-30 design. Metadata selects the HTTPS default under AG's 2026-10-28 policy, \
    retaining the original HTTP source URL. Full source-language parity, selected-flow \
    acceptance and live authorization are not established by publication.""",
    """\
    Borrowed serializers preserve the scoped request while rewriting impression and root \
    appnexus namespaces. Valid-member disagreement is fatal before calls; invalid impressions \
    retain valid siblings through bounded diagnostics. Calls cover ordered chunks of at most \
    10 valid impressions. Generated typed host settings resolve requested before base, then \
    normalize zero/absence to 5 for Auction/Amp or 6 for Video. Trusted entrypoint only.""",
    """\
    SDK projection is lazy and cached within one construction. Plain strings borrow the scoped \
    App extension; escaped strings and parser scratch reuse released working-copy storage. \
    Explicit display versions skip decoding. App is serialized before impressions, so an \
    oversized containing App refuses before derived allocation. Field order preserves JSON \
    meaning but can change gzip bytes and encoded-cap admission; gzip parity is not claimed.""",
    """\
    Nonzero member routing uses the shared bounded query setter, replacing every decoded \
    matching member_id after macro expansion. Unrelated expanded query bytes are preserved, \
    not reference-normalized; original and final URLs must each fit. Literal fragments refuse. \
    Zero member leaves the endpoint untouched. No URL reconstruction or scheme substitution.""",
    """\
    Original request ext must prove absence or object shape; typed Some is sufficient when \
    original evidence is unavailable. Null, malformed, duplicate and unknown-none shapes \
    refuse before calls. Canonical OpenRTB is the baseline, not numeric lexical, Unicode \
    folding or duplicate-key-order emulation. Single ASCII-equivalent owned spellings bind; \
    competing bindings refuse at request, impression or bid scope as appropriate.""",
    """\
    Sealed response parsing only. Missing/null outer bid.ext collapse to None and are refused \
    per bid; nonobject or incompatible reserved extension fields remain envelope failures. \
    Malformed provider fields and unsupported 0/1/3 media codes are bid-local. Shared offered \
    media/hint checks and exact sent-call identity remain mandatory. These strict typed-model \
    boundaries are explicit differences, not a second tolerant decoder or full source parity. \
    Category arrays must contain only strings; malformed elements refuse the envelope.""",
    """\
    All 95 source category pairs have an independently pinned extracted witness. Accepted \
    bids preserve provider fields and receive reserved prebid.video duration and empty \
    primary_category for every media type, including zero/negative duration. That video block \
    is replaced; unrelated extension fields remain. Signed i64 deal priority is preserved in \
    the typed reserved slot, with zero omitted; no clamping, side channel or new ranking rule.""",
    """\
    HTTP 204 ignores bodies; 400 is code 2, other non-200 is code 4, sealed failures code 14. \
    Currency defaults to USD and preserves nonempty source values; conversion and shared \
    video/native/AMP/browser delivery remain separate gates. The 31 verbatim protocol captures \
    total 117400 bytes, including original missing terminal newlines. Extra-info settings \
    use source literals 50/60; direct adapter capture success does not bypass schema admission.""",
    """\
    The original repeated-SDK capture returns test-imp-id while its actual call covers only \
    test-imp-id-1 and test-imp-id-2. Preserve the capture unchanged and assert the shared unsent \
    identity refusal rather than claiming response parity or weakening call-local coverage.""",
    """\
    Native allocation controls must measure actual request construction and post-parse \
    metadata growth against existing charges. No workload ceiling, coefficient, pool, \
    dependency or public route is widened. Schema/resource qualification, composed privacy, \
    deadlines/gzip and publisher delivery remain open after this protocol candidate.""",

]

