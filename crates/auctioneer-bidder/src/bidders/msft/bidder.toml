key = "msft"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[settings.fields]
hb_source = "optional_i64"
hb_source_video = "optional_i64"

[definitions.msft]
defaultEnabled = false
endpoint = "https://ib.adnxs.com/openrtb2"
gvlVendorID = 32

[definitions.msft.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.msft.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.msft.maintainer]
email = "prebid@microsoft.com"

[definitions.msft.openrtb]
version = 2.6

[definitions.msft.userSync]
key = "adnxs"

[definitions.msft.userSync.redirect]
url = "https://ib.adnxs.com/getuid?{{.RedirectURL}}"
userMacro = "$UID"

