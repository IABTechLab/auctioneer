[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/openx"
tree = "92ef5ac22a22bc95b565f74e19c66c3eb02f84d1"
port_differences = [
    """\
    Stateless Rust protocol candidate on the existing bounded Bidder contract, published \
    native-only and default inactive under AG's approved 2026-10-30 design. Publication \
    does not establish complete source parity, schema/resource qualification, selected-flow \
    acceptance or live authorization.""",
    """\
    Request contract: banner/native impressions share the first call, followed by \
    one call per video impression. Banner precedes video, then native for grouping and \
    fallback correlation; other offered media remain on the wire. Last surviving group \
    impression supplies delDomain and platform, including clearing prior values.""",
    """\
    Borrowed serializers use the shared capped sink and endpoint builder. Source \
    unit becomes tagid, positive customFloor replaces only a zero floor, exact prebid/bidder \
    impression-extension keys are removed, customParams is relocated, root ext is replaced, \
    and video.ext is replaced by rewarded=1 only for rwdd=1. Exhaustive borrowed root, \
    impression, extension and video views preserve unrelated fields without cloning caller \
    trees. Selection retains no per-impression vector or pre-reservation output buffers.""",
    """\
    Response contract: 204 skips parsing, 400 is code 2, other non-200 is code 4. \
    Absent/empty currency defaults to USD; other currency remains unchanged. Supported \
    integer mtypes 1/2/4 override fallback when offered. AG approved the OpenRTB-first \
    boundary on 2026-10-26: only an absent mtype uses sent-call fallback. Explicit null, \
    unsupported audio code 3, zero, unknown codes, non-integer values and competing \
    case-equivalent spellings reject only the affected bid. Valid sibling bids and \
    browser configurations survive. This intentionally differs from the reference's \
    fallback for unrecognized codes and whole-response DTO rejection for malformed \
    mtype. Unsent or unoffered bids also refuse locally. Existing shared conflicting \
    named-media-hint checks still apply; contradictory hints are not source parity.""",
    """\
    Metadata mapping uses existing bid.ext.prebid.meta and video wire owners, not \
    a new TypedBid channel. Source string-encoded dsp_id/brand_id and decimal buyer_id \
    supply IDs; invalid optional metadata suppresses metadata, not the bid. Source always \
    supplies video duration and first category, including zero/empty values. Null extension \
    metadata is handled safely instead of reproducing a source nil-pointer panic. Fresh \
    source IDs replace the entire reserved meta object, dropping stale IDs and keys; absent \
    source metadata preserves existing meta. Video always replaces its complete reserved \
    object. This follows pinned exchange.makeBidExtJSON ownership without a new output API.""",
    """\
    Single ASCII-case-equivalent known keys are accepted; competing spellings refuse the \
    affected impression, bid, metadata block or optional configuration scope even when equal. \
    Generic envelope case matching, duplicate identical JSON keys and source-language \
    numeric quirks are not bidder-local compatibility goals.""",
    """\
    Named inherited decoder boundary: required IDs/price and canonical null/shape handling \
    differ from Go defaults. Eager typed Bid.ext decoding can reject malformed nested \
    prebid/type/targeting and origbid fields response-fatally before local filtering, \
    losing otherwise valid siblings and optional configurations. Some canonical Option \
    nulls lose presence needed for case-ambiguity detection. Keep these explicit; no raw \
    response access, second parse or bidder-local decoder workaround is permitted.""",
    """\
    Optional fledge_auction_configs values move from the sealed parsed ext tree \
    into the shared auction_configs channel in stable key order. Invalid optional shapes \
    suppress only configurations. Valid configurations survive all locally rejected bids \
    and non-USD currency. Payloads supply no authoritative bidder/adapter identity.""",
    """\
    Ten original protocol captures total 37709 unchanged bytes. Both Fledge captures use \
    test-request-id, not the sent test-imp-id, as configuration key. Conformance preserves \
    those independent adapter outputs and asserts their lack of request/call coverage; \
    separately owned exchange filtering must refuse them. A valid-sent-ID local control \
    covers usable config-only output. No captured key is repaired or reinterpreted.""",
    """\
    The optional-params capture repeats test-imp-id within one call. Auctioneer's existing \
    metadata builder refuses duplicate coverage and refunds the call; this named boundary \
    does not count as original-request parity. Independent local tests cover numeric and \
    decimal-string units, floors and custom parameter relocation without duplicate IDs.""",
    """\
    Parameter capture contains exactly seven validParams and fifteen invalidParams \
    raw-string literals extracted from pinned params_test.go without execution. Only its \
    JSON container and escaping are locally authored. Schema/compiler qualification stays \
    separate. The factory fixture is local independent evidence, not an upstream artifact. \
    No Go, metadata YAML or duplicate license source is retained.""",
]

