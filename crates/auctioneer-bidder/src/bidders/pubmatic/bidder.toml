port_differences = [
    """\
    Protocol work retains the existing active factory and independently maintained public \
    definitions. No metadata endpoint promotion, routing approval, serving readiness, schema \
    qualification or resource qualification follows from these captures or registration.""",
    """\
    Request contract: one aggregate POST contains surviving banner, video and native \
    impressions; audio is removed, and audio-only or malformed impressions refuse locally. \
    The source's unused thirty-impression constant does not introduce chunking. Publisher \
    and wrapper selection follow surviving impression order; a complete root wrapper wins. \
    SDK source/version, adSlot sizes, kadfloor maximum, keywords, direct dctr/pmzoneid, FPD, \
    ae, gpid and skadn follow source transformations without restoring scrubbed inputs.""",
    """\
    Intentional identity boundary: wrapper.biddercode uses the resolved requested identity, \
    never an arbitrary first request.ext.prebid.aliases key. The captured alias case replays \
    with its requested pubmatic-alias; a separate canonical-identity control proves that \
    unrelated aliases cannot rewrite it. Marketplace seat data remains provider payload and \
    cannot override the exchange's authoritative requested bidder and adapter identities.""",
    """\
    Intentional determinism and input-safety boundaries: FPD targeting is emitted in stable \
    key order rather than Go map iteration order. Unsupported targeting shapes are ignored \
    without source panics. Finite decimal kadfloor parsing does not emulate nonfinite or \
    source-language numeric quirks. FPD numeric scalars use finite f64 display, removing an \
    integral .0 suffix; legacy scientific-exponent spelling is not reproduced. Competing \
    case-equivalent parameter spellings refuse \
    their owning scope; redacted diagnostics do not reproduce source parameter text. \
    All-invalid input returns one terminal unknown error plus bounded per-impression \
    construction diagnostics instead of the source's input-echoing error vector.""",
    """\
    Response contract: 204 is always no-bid without parsing, including nonempty bodies; 400 \
    is bad input and other non-200 statuses are server errors. Standard integer mtype is \
    required; missing, null, zero, unknown and malformed values have no legacy fallback. \
    Exact sent-call coverage and offered media are independently required. Valid siblings \
    survive bid-local failures. Audio is outside the declared capabilities and is rejected \
    even when the original pre-filter request carried audio. Absent or empty currency \
    defaults to USD.""",
    """\
    Response source metadata maps into existing bid.ext.prebid.meta, video and dealpriority \
    owners, not a new TypedBid channel. Provider priority replaces an existing destination \
    priority, clearing it for absent, null or nonpositive values. Only the first category \
    survives; source duration \
    defaults to zero and primary_category remains empty. ibv changes reported metadata to \
    video without changing the banner bid's actual media type. Native ADM unwraps the native \
    object while preserving its lexical bytes. Malformed native ADM refuses the affected bid \
    instead of returning the source's invalid creative alongside an error. Browser auction \
    configurations move through the sealed response channel without authoritative identities.""",
    """\
    Malformed or ambiguous recognized provider-extension values refuse only the affected bid, \
    rather than publishing partially interpreted metadata. The shared OpenRTB response ID \
    requirement remains strict: an ID-less empty object is a decode failure, not the reference's \
    defaulted no-bid. No bidder-local second envelope decoder is introduced.""",
    """\
    Twenty-three original protocol captures total 104454 unchanged bytes: four exemplary \
    and nineteen supplemental. bid_ext_ibv_true returns banner mtype for a video-only offer; \
    Auctioneer refuses this unoffered media rather than rewriting the capture. native_invalid_adm \
    also references an unsent impression, so derived controls separately isolate malformed \
    ADM refusal and sibling survival with a covered ID. app records a legacy error for absent \
    Bid.ext; Rust safely accepts that bid without inventing optional source metadata.""",
    """\
    Parameter capture contains exactly six validParams and twenty invalidParams raw-string \
    literals extracted from pinned params_test.go without execution. The empty invalid \
    literal remains empty and fails JSON parsing. Only container syntax and escaping are \
    locally authored. No Go, JavaScript or metadata YAML is retained or executed. The factory \
    fixture remains local evidence owned separately from immutable upstream captures.""",
    """\
    Inherited sealed DTO limits remain explicit: required bid IDs/price and eager nested \
    extension decoding may reject a response before bid-local filtering. Original duplicate \
    JSON keys and generic envelope case matching are not reconstructed by these tests. \
    Captures do not establish exhaustive source parity or live provider acceptance.""",
]

