key = "pubmatic"
factory = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.pubmatic]
endpoint = "https://hbopenbid.pubmatic.com/translator?source=prebid-server"
endpointCompression = "gzip"
gvlVendorID = 76

[definitions.pubmatic.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.pubmatic.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.pubmatic.maintainer]
email = "header-bidding@pubmatic.com"

[definitions.pubmatic.openrtb]
gpp-supported = true
version = 2.6

[definitions.pubmatic.userSync.iframe]
url = "https://ads.pubmatic.com/AdServer/js/user_sync.html?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&predirect={{.RedirectURL}}"
userMacro = ""

[definitions.pubmatic.userSync.redirect]
url = "https://image8.pubmatic.com/AdServer/ImgSync?p=159706&gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&pu={{.RedirectURL}}"
userMacro = "#PMUID"

