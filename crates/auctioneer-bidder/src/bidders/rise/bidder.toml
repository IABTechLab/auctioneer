repository = "https://github.com/prebid/prebid-server.git"
revision = "d7f8515b86258688304b0d9b6668c6a0e258bc9e"

[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/rise"
tree = "fa673df96d139d2bd036ca4a97454bee319ccd8e"
port_differences = [
    """\
    Bounded Rust protocol candidate with a discovered stateless factory and opt-in \
    native-only publication. The coordinator observed compiled semantic red against the \
    refusing stub \
    before Phase 2 implementation; the implemented candidate still awaits coordinator-owned \
    verification. Endpoint approval, serving activation, schema/resource qualification and \
    migration are not claimed.""",
    """\
    Requests scan impressions in order, fully decode each inspected row, choose raw nonempty \
    org before publisher_id, then trim and return even if empty. Later rows are not inspected, \
    filtered or compared for identifier consistency. All original scoped impressions and \
    ordered IDs remain in the one POST body with only Content-Type \
    application/json;charset=utf-8.""",
    """\
    Structured query construction is the priority contract's explicit difference from source's \
    raw ?publisher_id= concatenation. Shared EndpointBuilder::expand_with_query_into streams \
    into capped metadata after call reservation, preserving endpoint macros and existing query \
    while form-encoding the selected value. The request is borrowed directly into the sink's \
    capped writer; no request/info tree clone, intermediate URL String or uncapped body is \
    built. Controlled-native publication does not establish live authorization or acceptance.""",
    """\
    AG approved single equivalent case spellings and refusal of competing spellings for \
    remaining bidders on 2026-10-23, even without canonical spelling or with equal/null values. \
    ImpExtRise's placementId plus placementid hash collision selects json-iterator's general \
    Unicode strings.ToLower decoder for all three parameter fields; dotted capital I matches \
    publisher_id and placementId. The three-field ExtImpBidder container decoder folds ASCII \
    only. No source map is cloned and no sorted-map precedence is inferred.""",
    """\
    Missing parameter containers are bidder-fatal before selection. Explicit null bidder \
    parameters and null string fields allow source zero-value behavior and scanning. The \
    existing shared JsonField<Value> preserves missing/null/value; borrowed matching retains \
    canonical null presence while checking ASCII-equivalent bidder containers. Missing/null \
    outer imp.ext provenance, duplicate identical wire keys, unrelated ae/prebid validation and \
    general envelope case matching remain shared-boundary audit gaps, not recovered provenance.""",
    """\
    Source wraps request errors with fmt.Errorf and ReadCode checks only the outer Coder, so \
    request decode/no-identifier errors expose source code 999 rather than the wrapped jsonutil \
    code 14. The no-identifier message is preserved; request decoder messages are \
    fixed/redacted. Source status helpers map 204 to no response, 400 to code 2, other non-200 \
    to code 4 with the numeric-only source message. Sealed malformed envelopes remain code 14 \
    and node refusals code 4.""",
    """\
    Source response currency is preserved verbatim, including absent/empty string, by moving \
    parsed.cur around the shared classifier's empty-to-USD default without cloning it. Non-USD \
    exchange conversion/delivery qualification remains separate. Null currency and missing/null \
    response envelope fields still have inherited sealed typed-decoder differences.""",
    """\
    Source mtype is a signed int8 decoded as part of the response, with general \
    case-insensitive key matching. Sealed parsing happens once; borrowed preflight gives \
    malformed recognized values and competing spellings response-decode scope. In-range \
    unsupported values, absent/null zero and audio are per-bid errors with source code 999. \
    Only 1/2/4 select banner/video/native. Valid siblings survive source classification errors; \
    all-invalid uses Auctioneer Err instead of source's empty response plus errors. Shared \
    parsed-number provenance cannot distinguish lexical integer negative zero from floating \
    negative zero; that boundary remains unqualified.""",
    """\
    Shared classification additionally checks offered media, standard/prebid consistency and \
    known impression identity; exact sent-call coverage is mandatory. The source does not \
    perform those checks. The banner-and-video.json capture explicitly demonstrates source \
    accepting banner mtype for a video-only impression, and is a named shared compatibility \
    boundary control rather than parity evidence.""",
    """\
    Thirteen verbatim protocol captures total 36627 bytes: seven positive source-consistent \
    cases, three request failures, HTTP 400, all-unsupported mtype, and one shared \
    unoffered-media boundary. No source parameter-test file exists for Rise. Captures are \
    verified by the shared manifest-and-byte witness before each filtered dispatch. The worker \
    ran no Cargo; the implemented source tests and capture replays await coordinator-owned \
    green verification, independent review and shared delivery gates.""",
]

