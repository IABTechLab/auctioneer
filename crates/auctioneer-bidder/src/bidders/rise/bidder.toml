key = "rise"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.rise]
defaultEnabled = false
endpoint = "https://pbs.yellowblue.io/pbs"
endpointCompression = "gzip"
gvlVendorID = 1043

[definitions.rise.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.rise.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.rise.maintainer]
email = "rise-prog-dev@risecodes.com"

[definitions.rise.userSync.iframe]
url = "https://pbs-cs.yellowblue.io/pbs-iframe?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&redirect={{.RedirectURL}}"
userMacro = "[PBS_UID]"

[provenance]
origin = "reference"

