key = "rubicon"
factory = true
native_only = true

[settings.fields]
credentials_secret = "optional_secret_reference"
external_url = "optional_string"
region = "optional_string"

[definitions.rubicon]
defaultEnabled = false
disabled = false
endpoint = "https://{{.Host}}/a/api/exchange"
endpointCompression = "gzip"
gvlVendorID = 52
hostAllowlist = [
    "exapi-us-east.rubiconproject.com",
    "exapi-us-west.rubiconproject.com",
    "exapi-eu.rubiconproject.com",
    "exapi-apac.rubiconproject.com",
]

[definitions.rubicon.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.rubicon.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.rubicon.maintainer]
email = "header-bidding@rubiconproject.com"

[definitions.rubicon.openrtb]
gpp-supported = true
version = 2.6

[definitions.rubicon.userSync]
supports = ["redirect"]

[provenance]
origin = "reference"

[provenance.sources.upstream]
repository = "https://github.com/prebid/prebid-server.git"
revision = "d7f8515b86258688304b0d9b6668c6a0e258bc9e"

