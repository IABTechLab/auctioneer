port_differences = [
    """\
    Stateless Rust protocol candidate with borrowed transforms, bounded credentials, floor \
    conversion, source captures and bidder-owned conformance. Native-only publication uses \
    AG's approved explicit-region, opt-in routing to the four source HTTPS hosts. This does not \
    establish public activation, selected-flow acceptance or live authorization.""",
    """\
    Approved regional host settings accept exactly us-east, us-west, eu and apac, mapping \
    respectively to exapi-us-east.rubiconproject.com, exapi-us-west.rubiconproject.com, \
    exapi-eu.rubiconproject.com and exapi-apac.rubiconproject.com. The published template is \
    https://{{.Host}}/a/api/exchange with exactly those four complete hosts in hostAllowlist. \
    Uses the existing complete Host representation rather than a partial-host Region macro. \
    Missing, empty or unknown resolved region is fixed bidder-local code 5 before credential \
    selection or call reservation; no trimming, case folding, request/secret fallback, \
    default region, user-geo routing or failover. Fixed configured endpoints remain unchanged \
    but still require a valid explicit region.""",
    """\
    Preserve source_disabled=true provenance. The approved controlled-native policy is \
    disabled=false with defaultEnabled=false: explicit opt-in, never automatic enablement. \
    AG's approved 2026-10-30 design permits native-only publication without claiming \
    worst-case qualification, selected-flow acceptance or live connection authorization.""",
    """\
    Required request branches: canonical 2.6 ingress, multiformat splitting, complete-video \
    precedence, FPD target merging and IAB segments, native request_native, block lists, \
    device/source/regs/user rewrites, and impression-local USD floor conversion failures.""",
    """\
    Required response branches: scoped debug price overrides, metadata merge, seat buyer, root \
    bidid replacement for bid id 0, proprietary adm_native, and exact sent-media correlation. \
    OpenRTB-first unsupported/invalid mtype refusal precedes call-local media fallback.""",
    """\
    Host settings are generated from this manifest. region selects only an approved complete \
    hostname; credentials_secret names one bounded nonempty \
    atomic username/password/tracker bundle; external_url supplies pbs_url independently. No \
    request parameter, runtime code name, guessed endpoint or fabricated secret is a fallback.""",
    """\
    Source capture comparisons retain all original bytes. Tests use a synthetic transport URL \
    without promoting the source test URI; those contexts now supply explicit us-east. The source \
    test's empty pbs_version is compared with the compiled Auctioneer package version in a \
    comparison copy only. JSON numbers are compared by their f64 bits, not by decimal token \
    spelling.""",
    """\
    Standard response fields use the shared canonical OpenRTB DTO. Noncanonical standard-field \
    spellings are not source-language compatibility aliases, and malformed typed extensions \
    fail the response at that sealed boundary. Supported proprietary extension keys retain \
    the reviewed single-case-spelling/ambiguity policy; native map keys remain case-sensitive. \
    Impression-local target failures are checked before credential I/O and preserve usable \
    impression siblings. Legacy rewarded flags upgrade banner/native output \
    as well as video, without overriding an explicit standard rwdd value.""",
    """\
    AG approved the canonical-ingress/consumed-field boundary on 2026-10-27. Shared ingress owns \
    typed OpenRTB fields and legacy privacy rejection. Borrowed bidder preflight checks all \
    consumed supply-chain locations, legacy EIDs, DSA, first-entry multibid maxbids, rewarded \
    flags, GPID and slot data before credentials or sink work, including shadowed values and \
    otherwise filtered impressions. Malformed consumed extensions reject this bidder with a \
    fixed code 2. GPID/slot-data case variants enter this same bidder-wide stage intentionally, \
    instead of the source's later impression-local decode. Absent/null defaults, declared \
    widths and supported key ambiguity rules remain explicit; no enum or required-field \
    constraints are invented. Unconsumed framework fields and opaque extension payloads are \
    not decoded again. Parameter, target, media and floor failures remain impression-local. \
    This is not a second request decoder or full framework-wrapper equivalence claim.""",
]

