tree = "baf4ec315b0844a52f0e5ed8abf9ae08e52199c2"
port_differences = [
    """\
    Stateless Rust protocol candidate with source captures, native allocation controls and \
    sealed-response conformance. Current verification belongs to the priority-services plan, \
    not this provenance record. Opt-in native-only publication does not imply \
    publisher delivery or schema/resource qualification.""",
    """\
    Frozen reviewed version contract: source.ext.str is 10.0 and source.ext.version is the \
    compiled Cargo package version. Captured source expectations retain their original empty \
    version string; only comparison copies substitute the approved compiled value.""",
    """\
    Request contract: banner, video, then native calls per impression, with audio \
    removed. Root blocklists accumulate root entries and each successfully parsed impression's \
    entries, including preceding unsupported-media impressions, without deduplication. Placement \
    keys replace tagid. A zero test flag is omitted on the wire, matching source omitempty; \
    nonzero flags remain. Scoped input and unrelated fields remain unchanged.""",
    """\
    Approved FX contract: borrow operator-owned floor_currency from BidderRequestInfo; convert \
    positive nonempty non-USD floors to USD. ASCII-case-equivalent USD bypasses conversion. \
    Foreign three-letter ASCII codes use the shared fixed-stack case normalization; operator \
    snapshot keys remain strictly uppercase. Malformed codes refuse. Any conversion failure \
    is bidder-fatal and refunds all previously accepted calls, including when the \
    failing impression has no supported media. Conversion refusals use a fixed generic code \
    999 diagnostic, never rate or currency contents. No request-provided rates or invented \
    defaults are used.""",
    """\
    Reviewed OpenRTB-first response contract: valid standard mtype takes priority; declared \
    legacy ext.prebid.type fills only missing mtype. Null, invalid and unsupported standard \
    codes reject locally, never falling back. Media must match both the scoped impression \
    and the exact sent split-call correlation and covered ID. Missing both declarations \
    refuses instead of guessing from sent media. Valid siblings survive local failures. \
    Response currency is USD even when the provider declares another currency.""",
    """\
    The shared response partitioner and sent-media lookup remain authoritative for error \
    isolation and exact call coverage. Standard-first classification checks the scoped \
    impression without cloning or erasing its original legacy extension; only missing \
    standard media uses the existing shared bid classifier's named-hint checks.""",
    """\
    Source.ext absent/null is initialized safely instead of reproducing a nil-map panic. \
    Nonobject source.ext is safely refused by the typed ingress model before bidder entry; \
    no bidder-local raw decoder bypass is added. Shared eager typed response extensions can \
    still reject malformed nested objects before bid-local classification; this remains an \
    explicit shared-decoder boundary, not complete malformed-sibling parity.""",
    """\
    Status contract: 204 skips body parsing, 400 is bad input, and zero or every other non-200 \
    status is a fixed bad-server-response refusal. Provider content never enters diagnostics. \
    Sealed response parsing and existing budgets remain mandatory.""",
    """\
    Eleven original protocol captures retain all 37909 bytes, including the multiformat \
    capture's missing final newline. Source HTTP whatever.url is unchanged; local tests use \
    a fixed HTTPS endpoint without implying destination approval. No metadata YAML, foreign \
    source program or duplicate license is retained. Factory expectations are locally authored.""",
    """\
    Borrowed capped serializers retain neither transformed caller trees nor cumulative \
    blocklist/rate copies. Prefix projection revalidates successfully decoded parameters \
    while streaming. Native controls independently vary root, impression, source, placement, \
    current/preceding blocklists, call slots, impression count, body caps and operator-map \
    width. Real tree/map clones are negative controls against existing funding bounds; \
    passing allocation or hosted execution is not claimed before coordinator verification.""",
]

