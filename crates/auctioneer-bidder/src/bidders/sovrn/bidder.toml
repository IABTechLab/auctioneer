[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/sovrn"
tree = "b4c6e76a41fb2ea3427512a6d5660a88937051a0"
port_differences = [
    """\
    Implemented protocol candidate with a discovered stateless factory and opt-in native-only \
    publication. The coordinator observed compiled semantic red before implementation. Worker \
    verification is restricted to formatting, scoped diff and immutable capture checks; Cargo \
    evidence is coordinator-owned. Serving activation, endpoint approval, full source parity, \
    qualification and migration are not claimed.""",
    """\
    Borrowed capped root/impression/video serialization, ordered survivor-only metadata, fixed \
    bounded diagnostics and no caller mutation replace source request mutation and uncapped \
    json.Marshal. Source bad impressions are local BadInput; all-invalid means no call. Empty \
    input has no source error. Production builds no request-tree clone, survivor vector or \
    uncapped body.""",
    """\
    Source tagId and tagid are distinct exact-name fields; a nonempty tagid wins, otherwise \
    tagId. AG approved general single-equivalent-spelling matching and affected-impression \
    rejection of competing spellings on 2026-10-23, not collapsing the two declared fields. \
    jsonutil pins json-iterator v1.1.12; tag field hash collision selects its general \
    exact-name-then-strings.ToLower decoder, including dotted capital I. Fallback tag spellings \
    bind tagid, not tagId. Exact duplicate-key order is already lost at shared ingress.""",
    """\
    OpenRTB imp.bidfloor remains numeric. The bidder extension also accepts positive \
    numeric/decimal-string values only when the original is zero; nonzero original wins and \
    currency is unchanged. Malformed/nonpositive values and decimal overflow are ignored; a \
    surviving positive infinity is request-fatal before allocation. AG's 2026-10-24 \
    OpenRTB-first direction excludes emulating legacy hexadecimal/underscore float-string \
    syntax: those optional overrides are ignored using the existing standard parser, with no \
    new dependency. Null strings default empty; malformed tag/adunitcode types reject their \
    impression even when unused.""",
    """\
    Video uses presence-aware mimes.as_ref(), a nonnull signed-int8 protocols array and nonzero \
    maxduration; empty slices and negative duration pass source adapter checks. Protocol values \
    are checked without allocation, source null elements serialize as zero, and the borrowed \
    array view omits an empty slice. The borrowed video view also omits source scalar \
    maxextended=0 while preserving nonzero values. Invalid protocol elements remove the \
    affected impression through fixed code-2 diagnostics; the source's earlier typed \
    request-ingress boundary remains separately qualified. Original ext, adunitcode, FPD, \
    privacy fields and other root fields remain intact.""",
    """\
    Headers derive only from already-scoped device UA/IP/language, present DNT including zero, \
    and whitespace-trimmed buyeruid as ljt_reader cookie. No inbound transport headers or \
    alternate user IDs are read. Header injection/cookie grammar disposition is not invented \
    here; shared metadata currently bounds but does not validate header values.""",
    """\
    HTTP 204 ignores even malformed bodies, HTTP 400 is BadInput code 2, and other non-200 \
    statuses are BadServerResponse code 4. Valid wire currency is ignored for source USD. \
    Shared sealed parse/schema/node-budget errors retain their existing provenance. Before any \
    ADM filtering, every parsed bid's mtype passes the shared borrowed signed_byte check: \
    missing/null becomes zero, one ASCII-equivalent spelling is accepted, and \
    malformed/out-of-range or competing spellings fail the whole response with fixed \
    BadServerResponse code 4 as in Sovrn's source wrapper. Well-typed mtype remains ignored for \
    media selection.""",
    """\
    ADM query-unescaping reuses the sealed parser's String allocation in place, including \
    plus-to-space; malformed percent escapes silently drop only that bid before impression \
    lookup. Unknown impressions are redacted bid-local BadInput. Matching video takes \
    precedence over banner; generic media-hint restrictions are not inherited. Shared response \
    partitioning and actual sent-call coverage preserve eligible siblings. All-invalid errored \
    responses use Auctioneer Err. AG approved rejecting decoded invalid UTF-8 with a fixed \
    bid-local code-4 error and preserving valid siblings on 2026-10-24; arbitrary \
    invalid-string compatibility is intentionally out of scope.""",
    """\
    31 untouched captures total 96993 bytes: 3 exemplary, 19 supplemental, 5 video and 4 \
    videosupplemental; 26 expected calls, 5 request refusals, 2 empty bid responses, 23 \
    positive bid responses and 1 unknown-imp response. The shared optional-seat decoder now \
    accepts the 24 bid-bearing responses without synthesis or exemptions. All captures use \
    literal source expectations, including full-video maxextended omission. Capture \
    verification precedes every filtered dispatch; these checks do not establish hosted \
    delivery or full migration.""",
    """\
    Outer ExtImpBidder lookup preserves the optimized source decoder's ASCII-only matching: a \
    single bidder/Bidder/BIDDER-equivalent spelling is borrowed, while competing spellings \
    reject only their impression even with equal/null values or no canonical key. Canonical \
    JsonField null presence participates in ambiguity checks. This lookup neither clones source \
    maps nor infers sorted precedence. The coordinator observed six intended semantic \
    regression failures before these repairs. Typed/schema request-ingress validation, \
    unrelated ae/prebid and general envelope case/null/shape gaps remain separate shared audit \
    work.""",
    """\
    Protocol captures retain the source HTTP URI verbatim; bidder code does not rewrite its \
    scheme. Native provenance separately records AG's HTTPS default without endpoint \
    promotion. Parameter schema remains verbatim and intentionally requires exactly \
    one canonical tag field; direct adapter coexistence/fallback tests do not imply \
    schema-level acceptance. Shared envelope case/null/shape, privacy, resource, decode and \
    hosted-delivery gates remain open.""",
]

