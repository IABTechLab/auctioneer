key = "sovrn"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.sovrn]
defaultEnabled = false
endpoint = "https://pbs.lijit.com/rtb/bid?src=prebid_server"
endpointCompression = "gzip"
gvlVendorID = 13

[definitions.sovrn.capabilities.app]
mediaTypes = [
    "banner",
    "video",
]

[definitions.sovrn.capabilities.site]
mediaTypes = [
    "banner",
    "video",
]

[definitions.sovrn.maintainer]
email = "sovrnoss@sovrn.com"

[definitions.sovrn.userSync.iframe]
url = "https://ap.lijit.com/beacon/prebid-server/?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&url={{.RedirectURL}}"
userMacro = "$UID"

[definitions.sovrn.userSync.redirect]
url = "https://ap.lijit.com/pixel?redir={{.RedirectURL}}"
userMacro = "$UID"

[provenance]
origin = "reference"

