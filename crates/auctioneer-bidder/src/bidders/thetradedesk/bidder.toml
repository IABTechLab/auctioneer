key = "thetradedesk"
factory = true
native_only = true

[endpoint.fields]
supply_id = "SupplyId"

[settings.fields]
supply_id = "optional_string"

[definitions.thetradedesk]
defaultEnabled = false
endpoint = "https://direct.adsrvr.org/bid/bidder/{{.SupplyId}}"
gvlVendorID = 21

[definitions.thetradedesk.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.thetradedesk.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.thetradedesk.maintainer]
email = "Prebid-Maintainers@thetradedesk.com"

[definitions.thetradedesk.openrtb]
gpp-supported = true

[definitions.thetradedesk.userSync]
supports = [
    "redirect",
    "iframe",
]

[definitions.ttd]
aliasOf = "thetradedesk"
defaultEnabled = false
endpoint = "https://direct.adsrvr.org/bid/bidder/{{.SupplyId}}"
gvlVendorID = 21

[definitions.ttd.capabilities.app]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.ttd.capabilities.site]
mediaTypes = [
    "banner",
    "video",
    "native",
]

[definitions.ttd.maintainer]
email = "Prebid-Maintainers@thetradedesk.com"

[definitions.ttd.openrtb]
gpp-supported = true

[definitions.ttd.userSync]
supports = [
    "redirect",
    "iframe",
]

