key = "triplelift"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.triplelift]
defaultEnabled = false
endpoint = "https://tlx.3lift.com/s2s/auction?sra=1&supplier_id=20"
endpointCompression = "gzip"
gvlVendorID = 28

[definitions.triplelift.capabilities.app]
mediaTypes = [
    "banner",
    "video",
]

[definitions.triplelift.capabilities.site]
mediaTypes = [
    "banner",
    "video",
]

[definitions.triplelift.maintainer]
email = "prebid@triplelift.com"

[definitions.triplelift.openrtb]
gpp-supported = true
version = 2.6

[definitions.triplelift.userSync.iframe]
url = "https://eb2.3lift.com/sync?gdpr={{.GDPR}}&cmp_cs={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&redir={{.RedirectURL}}"
userMacro = "$UID"

[definitions.triplelift.userSync.redirect]
url = "https://eb2.3lift.com/getuid?gdpr={{.GDPR}}&cmp_cs={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&gpp={{.GPP}}&gpp_sid={{.GPPSID}}&redir={{.RedirectURL}}"
userMacro = "$UID"

[provenance]
origin = "reference"

[provenance.sources.upstream]
repository = "https://github.com/prebid/prebid-server.git"
revision = "d7f8515b86258688304b0d9b6668c6a0e258bc9e"

[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/triplelift"
tree = "ffe1d2c46af7dba7973f74dcd694d6feaf826125"
port_differences = [
    """\
    Bounded Rust protocol candidate with a discovered stateless factory and opt-in native-only \
    publication; serving acceptance, schema/resource qualification and \
    complete migration remain open. Pending wave approval is not inferred.""",
    """\
    Borrowed capped serialization replaces source request/impression copies and a retained \
    survivor slice. Parameters are inspected allocation-free in preflight and streaming; \
    diagnostics are recorded once. Metadata and body include the same ordered survivors.""",
    """\
    Parameter decode errors (source 14) and unsupported media (source 999) use the shared \
    capped construction diagnostics with code 2; the all-invalid No valid impressions for \
    triplelift error retains source 999. Safe fixed diagnostics never echo request values or \
    parser errors.""",
    """\
    Zero and negative-zero floor overrides clear old floors and omit bidfloor, and \
    empty/default inventory clears old tagid and omits it. The original extension remains \
    unchanged. AG separately approved single case-insensitive inventoryCode, floor, \
    triplelift_pb and format keys on 2026-10-23. Competing spellings reject only the affected \
    impression or bid, even with equal/null values; source last-on-wire precedence cannot be \
    recovered from shared parsed maps. Exact duplicate-key order remains an inherited gap.""",
    """\
    Source json-iterator's general parameter decoder lowercases inventoryCode keys, including \
    dotted capital I; its optimized one-field media decoders fold ASCII only. The \
    allocation-free Rust lookup preserves that distinction, with malformed and ambiguous \
    dotted-I controls. The source JSON helper and dependency manifest are pinned separately.""",
    """\
    Presence-aware typed imp.ext.bidder now distinguishes missing, null and value: missing \
    refuses, while explicit null allows source defaults and remains null on the outbound wire. \
    Shared parsed response extensions still merge absence and null into the current banner \
    fallback; those response and envelope-level case gaps remain unqualified. Unrelated source \
    imp.ext.ae/prebid validation is not recreated by scoped parameter parsing.""",
    """\
    HTTP 204 ignores its body, 400 is code 2 and other non-200 statuses are source code 999. \
    The source numeric-only status message is preserved. Valid response currency is \
    deliberately ignored for USD, as in source.""",
    """\
    Nested integer triplelift_pb.format 11/12/17 supplies video, otherwise banner. Shared \
    classification additionally rejects contradictions, unoffered media and unknown IDs, and \
    this bidder checks actual sent-call coverage so filtered impressions cannot regain bids. \
    Candidate-local failures preserve valid siblings; all-invalid results use Auctioneer Err rather \
    than an empty response plus errors.""",
    """\
    Twelve verbatim captures total 29226 bytes: ten candidate end-to-end cases and two \
    shared-boundary controls. String imp.ext fails shared typed ingress before dispatch, while \
    string bid.ext fails sealed whole-response decoding before local classification. They are \
    not evidence of source-local-error parity. Only captured integral bidfloor 20 versus Rust \
    f64 20.0 is normalized explicitly for comparison.""",
]

