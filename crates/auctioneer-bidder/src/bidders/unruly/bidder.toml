key = "unruly"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.unruly]
defaultEnabled = false
endpoint = "https://targeting.unrulymedia.com/unruly_prebid_server"
gvlVendorID = 36

[definitions.unruly.capabilities.app]
mediaTypes = [
    "banner",
    "video",
]

[definitions.unruly.capabilities.site]
mediaTypes = [
    "banner",
    "video",
]

[definitions.unruly.maintainer]
email = "prebidsupport@unrulygroup.com"

[definitions.unruly.openrtb]
gpp-supported = true
version = 2.6

[definitions.unruly.userSync.redirect]
url = "https://sync.1rx.io/usersync2/rmphb?gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&redir={{.RedirectURL}}"
userMacro = "[RX_UUID]"

[provenance]
origin = "reference"

