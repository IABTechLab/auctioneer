[[provenance.trees]]
category = "implementation"
source = "upstream"
source_path = "adapters/unruly"
tree = "8c36519f90f9ac19a1f795bb6f4fc4dd4c579907"
port_differences = [
    """\
    Stateless Rust protocol candidate, promoted by the coordinator after observed semantic red. \
    Factory is true for qualification; native-only publication remains opt-in. No serving \
    acceptance, \
    completed port, parity, migration or resource qualification is claimed.""",
    """\
    Source rewrites each imp.ext to bidder:{siteid,siteId}, dropping all other extension \
    members and unknown parameter members while preserving other request and impression \
    subtrees. Rust prevalidates all impressions before reservation and streams this borrowed \
    transform through the capped sink without request clones or uncapped body materialization.""",
    """\
    Malformed outer extension or parameters are bidder-fatal BadInput (2), not impression \
    filtering. Source accepts empty and null parameter structs as zero fields although its \
    canonical schema requires exactly one of siteid/siteId. Tests exercise protocol behavior \
    separately from schema qualification.""",
    """\
    Source jsoniter v1.1.12 general decoder preserves distinct exact siteid and siteId fields; \
    all other strings.ToLower matches bind to old siteid, including dotted capital I. No merge \
    or preference eliminates either canonical field. AG approved rejecting competing spellings \
    only when they bind to the same source field, including equal/null and noncanonical-only \
    competitors. Exact duplicate key order is unavailable after shared parsing.""",
    """\
    Source ExtImpBidder uses an optimized ASCII-only decoder for bidder/prebid/ae. Recognized \
    prebid and signed-int8 ae values are decoded before being discarded; malformed values and \
    ambiguities must remain bidder-fatal. Shared typed ingress cannot represent every source \
    raw extension shape.""",
    """\
    Source accepts all impression media in construction, then chooses banner before video on \
    the matching impression in response decoding. Audio/native-only or missing impressions fail \
    locally; valid siblings survive. Shared sent-call correlation and standard media conflict \
    checks are additional existing boundaries, not source parity.""",
    """\
    HTTP 204 ignores the body; 400 is BadInput (2); every other non-200 is BadServerResponse \
    (4). Source's helper fixes currency to USD regardless of valid response.cur and does not \
    convert price. Shared sealed parse errors retain ResponseParse provenance/code 14 and \
    node-limit code 4 rather than exposing source parser details.""",
    """\
    Source decodes dur as signed int64 and mtype as signed int8 across the entire response DTO \
    before candidate filtering. Rust preflights all parsed bids with the shared wire_fields \
    helpers before canonical projection or classification. Malformed values and competing ASCII \
    spellings, including equal/null competitors without a canonical name, fail the whole \
    response with fixed BadServerResponse code 4 and Kind Other. Shared canonical_integer \
    normalizes a sole dur spelling and omits source zero/null/default values without copying \
    any tree.""",
    """\
    Source sets separate TypedBid.BidVideo metadata only for video with positive signed \
    duration; both duration and primary_category serialize without omitempty. After \
    coordinator-observed semantic red, Rust materializes the approved outgoing ext.prebid.video \
    using the existing extension representation only on accepted positive-duration video bids. \
    Duration is replaced, primary_category defaults to the empty string only when missing, and \
    all other existing video/prebid/bid fields are preserved. Serialized-wire units cover \
    absent/present extensions, negative/zero/banner controls, default/existing category values \
    and duration case projection. Composed response allocation verification remains \
    coordinator-owned.""",
    """\
    Shared JsonField distinguishes canonical missing/null/value for ImpExt.bidder and \
    ImpExt.prebid. Null struct parameters write both zero fields without guessing through \
    as_ref. Canonical prebid:null remains present for competing ASCII-spelling rejection, \
    while absent prebid and a sole null spelling remain accepted. Bidder units cover both \
    impression orders and unspent call permits. Nested canonical bidder/imp empty-map \
    presence and storedrequest:null are still lost; ambiguity involving those discarded \
    canonical names cannot be reconstructed. Full migration remains open.""",
    """\
    All eleven original JSON protocol captures are retained byte-identically, including \
    missing-extension.json without a final newline. Source runner compares JSON structurally \
    and omits video metadata checks when the capture has no video expectation. For simple-video \
    only, conformance proves both source bids lack ext, asserts the sole added root field is \
    exactly prebid.video={duration:30,primary_category:empty string}, then compares every \
    original source bid field without deleting any field or deriving expectations from actual \
    output. Capture failure checks require exact fixed BidderError values with Kind Other, not \
    only numeric codes that could accidentally accept node-gate failures. Source tests and Go \
    programs were not executed. HTTP capture endpoints are test data, not production endpoint \
    approval.""",
    """\
    Source missing-extension and unknown-imp diagnostics echo caller IDs. Rust uses fixed \
    redacted errors instead; all-invalid bid-local failures use shared Err rather than a source \
    empty response plus errors. Empty configured endpoint emits no call only after source \
    parameter validation. Representable nested prebid helper values and case matching are \
    validated without copying source maps; lost nested canonical null/empty presence remains \
    a shared provenance requirement.""",
]

