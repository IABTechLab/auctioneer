key = "yahoo_ads"
factory = true
native_only = true

[endpoint.fields]
account_id = "AccountID"
publisher_id = "PublisherID"

[definitions.yahooAds]
defaultEnabled = false
endpoint = "https://s2shb.ssp.yahoo.com/admax/bid/partners/PBS"
gvlVendorID = 25

[definitions.yahooAds.capabilities.app]
mediaTypes = [
    "banner",
    "video",
]

[definitions.yahooAds.capabilities.site]
mediaTypes = [
    "banner",
    "video",
]

[definitions.yahooAds.maintainer]
email = "prebid-tech-team@yahooinc.com"

[definitions.yahooAds.userSync]
supports = ["redirect"]

