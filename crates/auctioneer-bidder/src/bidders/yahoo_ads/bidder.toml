    """\
    Rust protocol candidate with an automatically discovered stateless factory and opt-in \
    native-only publication. Complete resource/schema qualification, completed migration \
    and live acceptance are not claimed.""",
    """\
    One POST per surviving impression, preserving all original video/native/audio beside any \
    normalized banner. A mixed banner/video impression remains one call. The bounded \
    correlation row records Banner-first response selection, not deletion of other offered \
    media. The earlier two-calls-per-medium draft was withdrawn and is not approved policy.""",
    """\
    The direct adapter decodes parameter types without imposing schema required/minLength \
    rules. Missing/null string members and null parameter structs have source empty values; \
    empty tagid and replacement inventory IDs are omitted. Canonical parameter schema remains \
    verbatim and is independently qualified.""",
    """\
    AG-approved single ASCII-equivalent parameter/container spellings are accepted; competing \
    spellings fail at impression scope even when equal/null. There is no new legacy-language \
    parser, decoder, schema engine or dependency.""",
    """\
    Borrowed serializers write through the existing capped sink; only caller-scoped data is \
    used and no request tree or serialized body is cloned. Invalid banner rejects its entire \
    impression, including any video, while later impressions survive. Source first-format \
    dimensions are not revalidated.""",
    """\
    Fixed construction diagnostics use existing code 2 instead of source raw messages/plain \
    banner error code 999. Nonempty GPP relocates exact map keys and clears top-level fields; \
    absent SID preserves old extension SID, explicit empty SID overwrites it. Shared typed \
    null/absent regs.ext safely becomes an object rather than reproducing the source nil-map \
    panic.""",
    """\
    Unsupported-only impressions retain an explicitly named safe local refusal rather than the \
    source unsupported HTTP call followed by silently ignored bids. The original unsupported \
    capture is kept unchanged and asserts this boundary without claiming provider delivery.""",
    """\
    Yahoo response status remains 204 no-bid and 200 decode; every other status including 400 \
    is fixed BadServerResponse code 4. Currency stays USD without price conversion. Shared \
    sealed decode retains code 14/ResponseParse and node refusal 4/ResponseParse instead of \
    exposing source parser messages.""",
    """\
    Source dur signed-int64 and mtype signed-int8 fields are preflighted response-wide and \
    canonicalized with existing wire_fields. Duration never adds Unruly-style video metadata. \
    Exact sent media uses shared sent_media_type; media conflicts and unsent/unknown bids fail \
    locally while valid siblings survive, unlike the source unknown-ID whole-response abort.""",
    """\
    All thirteen protocol captures are retained byte-identically, totaling 25589 bytes. All \
    nine source URIs remain empty. Conformance supplies one fixed test-only HTTPS endpoint and \
    explicitly compares it separately from the unchanged source empty URI; no production \
    default or scheme substitution is introduced.""",
    """\
    Source captures with schema-incomplete parameters are direct-adapter dimension cases, not \
    schema acceptance evidence. Implementation/helper source is Git-object provenance only; no \
    Go programs are retained as repository assets or included by conformance. The CLI \
    source-object checker owns source verification. Metadata/schema captures already owned by \
    the worktree remain unchanged.""",
    """\
    Shared typed ingress required/null/case/shape distinctions and dimension/SID widths remain \
    explicit OpenRTB model boundaries. Unrelated legacy ae/prebid helper quirks are not \
    reimplemented. Privacy, resource qualification, source integrity gates and hosted media \
    delivery remain coordinator-owned requirements.""",
]

