# Dependency-neutral by design: serde-only by default, never depending on
# auctioneer-core or auctioneer-config-data. Portable operator models live
# under config-model; build scripts consume native build-support separately.
[package]
name = "auctioneer-config"
description = "Configuration schemas and optional native build support shared by auctioneer crates."
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[[test]]
name = "root_shape"
required-features = ["config-model"]

[features]
# Shared effective configuration and validation, without parsers or code generators.
config-model = [
    "dep:http",
    "dep:ipnetwork",
    "dep:auctioneer-runtime",
    "dep:percent-encoding",
    "dep:unicode-case-mapping",
    "dep:url",
    "dep:validator",
    "serde/rc",
]
# Native tooling and build scripts only. Serving dependencies use config-model.
build-support = [
    "config-model",
    "dep:hex",
    "dep:auctioneer-openrtb",
    "dep:auctioneer-openrtb-catalogue",
    "dep:proc-macro2",
    "dep:quote",
    "dep:serde_json",
    "dep:sha2",
    "dep:syn",
    "dep:time",
    "dep:toml",
]
insecure-bidders = []

[dependencies]
serde = { workspace = true }
http = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ipnetwork = { workspace = true, optional = true }
auctioneer-runtime = { workspace = true, optional = true }
auctioneer-openrtb = { workspace = true, optional = true }
auctioneer-openrtb-catalogue = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
time = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
unicode-case-mapping = { workspace = true, optional = true }
url = { workspace = true, optional = true }
validator = { workspace = true, optional = true }

[dev-dependencies]
# The config-model root-shape tests compare direct typed JSON/TOML payloads.
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
auctioneer-macros = { workspace = true }
rustix = { workspace = true }
tempfile = { workspace = true }
