# GDPR enforcement is ACTIVE but purpose 2 enforcement is OFF, so a
# request whose consent is unusable still reaches fan-out: the
# unusable-consent row is `AllowBidRequest = !p2_enforced`, `PassID =
# false`, `PassGeo = !sf1_enforced`.
#
# Special feature 1 is deliberately left unconfigured on both layers, so
# `PassGeo` stays true and the geo/IP scrub is inactive — the ID scrub is
# then observable on the outbound body on its own.

[gdpr]
enabled = true

[gdpr.tcf2]
enabled = true

[gdpr.tcf2.purposes.2]
enforce_algo    = "full"
enforce_purpose = "disabled"
enforce_vendors = "disabled"

[accounts."acct-1".gdpr]
enabled         = "enabled"
channel_enabled = { web = "enabled" }
