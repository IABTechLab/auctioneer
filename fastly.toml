authors = [""]
description = ""
language = "rust"
manifest_version = 3
name = "auctioneer-adapter-fastly"
service_id = ""

[local_server]

[local_server.config_stores]

[local_server.config_stores.auctioneer_config]
format = "inline-toml"

[local_server.config_stores.auctioneer_config.contents]
# Populate locally with: auctioneer-cli config push --adapter fastly --local.
auctioneer_config = ''

# Health remains closed unless a local development token is supplied.
allow_unauthenticated_health = "false"

[[local_server.secret_stores.auctioneer_secrets]]
key = "health_gvl_token"
# Viceroy uses an empty value when this host environment variable is unset.
# Supply a development-only token when running `fastly compute serve`.
env = "AUCTIONEER__RUNTIME__HEALTH_GVL_TOKEN"

[[local_server.secret_stores.auctioneer_secrets]]
key = "usersync_cookie_keyring"
# Local Viceroy provisioning only: this example host env name is not a
# runtime config knob or a production secret lookup name. Unset means empty.
# Production uses the usersync_cookie_keyring item in the linked default store.
env = "AUCTIONEER__USERSYNC__COOKIE_KEYRING"
# Provisioning and rotation: docs/deployment/usersync-cookie-keys.md.

[scripts]
build = "cargo build --locked --package auctioneer-adapter-fastly --bin auctioneer-adapter-fastly --profile release --target wasm32-wasip1"
